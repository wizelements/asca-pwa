<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6b3a">
  <title>Offline | ASCA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      background: radial-gradient(circle at 50% 30%, rgba(230,213,67,.15), transparent 22rem),
                  linear-gradient(160deg, #255f39 0%, #1f6b3a 50%, #174f2b 100%);
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 30rem); text-align: center; }
    .mark {
      width: 7rem; height: 7rem; margin: 0 auto; padding: .45rem; overflow: hidden;
      border-radius: 2rem; background: #fff;
      box-shadow: 0 1.5rem 3.5rem rgba(0,0,0,.24), 0 0 0 1px rgba(255,255,255,.25);
    }
    .mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .eyebrow { margin-top: 1.5rem; color: #e6d543; font-size: .68rem; font-weight: 800; letter-spacing: .23em; text-transform: uppercase; }
    h1 { margin-top: .55rem; font-size: clamp(2rem,10vw,3rem); line-height: 1; letter-spacing: -.03em; }
    p { margin: 1rem auto 0; max-width: 25rem; color: rgba(255,255,255,.78); font-size: .95rem; line-height: 1.65; }
    a {
      display: inline-flex; min-height: 3rem; align-items: center; justify-content: center;
      margin-top: 1.6rem; padding: .75rem 1.6rem; border-radius: 9999px;
      background: #e6d543; color: #1f1f1f; text-decoration: none;
      font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="/icons/icon-192.png" alt=""></div>
    <div class="eyebrow">Atlanta Saddle Club Association</div>
    <h1>You’re offline.</h1>
    <p>ASCA is still installed and ready. Reconnect to the internet, then try again to continue to the latest events, members, and club updates.</p>
    <a href="/" onclick="location.reload(); return false;">Try Again</a>
  </main>
</body>
</html>
