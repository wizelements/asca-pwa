<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - ASCA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7f3ea;
      color: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 480px; }
    .logo { font-size: 3rem; font-weight: 800; color: #e6d543; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #4f4f4f; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      background: #1f6b3a;
      color: #fff;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🐴</div>
    <div class="logo">ASCA</div>
    <h1>You&rsquo;re Offline</h1>
    <p>It looks like you&rsquo;ve lost your connection. Check your internet and try again. The ASCA community is waiting for you!</p>
    <a href="/" class="btn" onclick="location.reload(); return false;">Try Again</a>
  </div>
</body>
</html>
